# SignalGraph global settings
# Paths are relative to the repository root unless absolute.

project:
  name: signalgraph
  primary_platform: kalshi

paths:
  data_dir: data
  raw_dir: data/raw
  normalized_dir: data/normalized
  processed_dir: data/processed
  config_dir: config

platforms:
  kalshi:
    # Public market data does not require authentication.
    base_url: https://api.elections.kalshi.com/trade-api/v2
    # Alternative documented host:
    # base_url: https://external-api.kalshi.com/trade-api/v2
    timeout_seconds: 30
    max_retries: 3
    # Candlestick period intervals supported by Kalshi API (minutes).
    # Note: Kalshi currently documents 1, 60, and 1440 only.
    # 5-minute / 15-minute research series are produced by local resampling.
    candlestick_period_minutes: [1, 60, 1440]
  polymarket:
    # Scaffolding only — endpoints and auth requirements must be verified
    # before production use. Do not assume Gamma/CLOB URLs alone are sufficient
    # for complete historical reconstruction.
    base_url: https://gamma-api.polymarket.com
    clob_url: https://clob.polymarket.com
    timeout_seconds: 30
    max_retries: 3
    status: scaffolding

normalization:
  # All timestamps are stored and compared in UTC.
  timezone: UTC
  # Drop duplicate platform/market_id/timestamp rows after normalization.
  drop_duplicate_observations: true
  # Probabilities must be in [0, 1].
  probability_min: 0.0
  probability_max: 1.0

resampling:
  # Supported research intervals (minutes).
  intervals_minutes: [1, 5, 15, 60]
  # Forward-fill only. Never backward-fill future prices.
  forward_fill: true
  backward_fill: false

research:
  # Lead-lag horizons in minutes for H1 tests.
  horizons_minutes: [1, 5, 15, 30, 60]
  # Chronological validation only — never random shuffle.
  validation:
    method: chronological
    train_fraction: 0.6
    validation_fraction: 0.2
    test_fraction: 0.2

simulation:
  default_n_simulations: 10000
  # Correlation handling is an explicit research concern; default is
  # independent Bernoulli draws only as a transparent baseline.
  default_correlation_mode: independent

backtest:
  # Framework defaults — not a claim of profitability.
  default_threshold: 0.02
  include_platform_fees: true
  include_spread_costs: true
  default_slippage: 0.0

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
